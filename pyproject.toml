[project]
name = "claude-usage"
version = "0.1.0"
description = "Claude Code status line with reliable cost & token tracking, plus a usage report CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
claude-statusline = "claude_usage.statusline:main"
claude-usage = "claude_usage.report:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
